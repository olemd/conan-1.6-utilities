[project]
name = "conan-utils"
version = "0.4.0"
description = "Small utilities for Conan 1.x (targets 1.66)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ole-Morten Duesund" }]
requires-python = ">=3.8"
dependencies = ["conan>=1.66,<2"]

[project.scripts]
conandeps = "conandeps:main"
conansbom = "conansbom:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single-module layout: ship the tool files themselves, not a package directory.
[tool.hatch.build.targets.wheel]
only-include = ["conandeps.py", "conansbom.py"]

[dependency-groups]
# cyclonedx-python-lib and spdx-tools validate conansbom output against the
# CycloneDX schema and the SPDX spec in the tests only; the tools themselves
# stay stdlib + Conan.
dev = ["cyclonedx-python-lib[json-validation]", "pytest", "ruff", "spdx-tools"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
