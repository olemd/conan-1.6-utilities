[project]
name = "conan-utils"
version = "0.1.0"
description = "Small utilities for Conan 1.x (targets 1.66)"
requires-python = ">=3.8"
dependencies = ["conan>=1.66,<2"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
